<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="LapCircuit">
  <title>LapCircuit</title>
  <defs>
    <linearGradient id="lcTrace" x1="118" y1="290" x2="620" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F62FE"/>
      <stop offset=".52" stop-color="#1E9BFF"/>
      <stop offset="1" stop-color="#34DBFF"/>
    </linearGradient>
    <linearGradient id="lcScreen" x1="70" y1="122" x2="546" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081020"/>
      <stop offset=".55" stop-color="#0E2A55"/>
      <stop offset="1" stop-color="#1B58A8"/>
    </linearGradient>
    <linearGradient id="lcBezel" x1="52" y1="104" x2="564" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8B4C6"/>
      <stop offset="1" stop-color="#4E5866"/>
    </linearGradient>
    <linearGradient id="lcDeck" x1="320" y1="366" x2="320" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#788599"/>
      <stop offset="1" stop-color="#39424F"/>
    </linearGradient>
    <linearGradient id="lcLip" x1="0" y1="406" x2="0" y2="428" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF3FA"/>
      <stop offset="1" stop-color="#96A3B6"/>
    </linearGradient>
  </defs>

  <!-- laptop screen -->
  <rect x="52" y="104" width="512" height="258" rx="18" fill="#080C13" stroke="url(#lcBezel)" stroke-width="11"/>
  <rect x="70" y="122" width="476" height="222" rx="8" fill="url(#lcScreen)" stroke="url(#lcTrace)" stroke-width="7"/>

  <!-- keyboard deck + front lip -->
  <path d="M52 366H564l52 44H0Z" fill="url(#lcDeck)"/>
  <rect x="281" y="379" width="94" height="16" rx="5" fill="#8E9AAD"/>
  <rect x="0" y="406" width="640" height="22" rx="11" fill="url(#lcLip)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="url(#lcTrace)" stroke-width="17" stroke-linejoin="round" stroke-linecap="butt">
    <path d="M232 60v40l-36 36h-78"/>
    <path d="M205 174l95-105h100"/>
    <path d="M205 226l105-105h55l69-69"/>
    <path d="M243 264l120-120h67l92-92"/>
    <path d="M566 120h-70l-50 50h-46"/>
    <circle cx="232" cy="38" r="22"/>
    <circle cx="452" cy="34" r="22"/>
    <circle cx="540" cy="34" r="22"/>
    <circle cx="592" cy="120" r="22"/>
  </g>
  <g fill="url(#lcTrace)">
    <circle cx="205" cy="174" r="15"/>
    <circle cx="205" cy="226" r="15"/>
    <circle cx="243" cy="264" r="15"/>
  </g>
</svg>
